<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Semicircle Globe -->
  <path d="M40 256 A 216 216 0 0 0 472 256 Z" fill="#FFF7ED" stroke="#F97316" stroke-width="20" />
  
  <!-- Continent lines inside globe -->
  <path d="M120 256 c 10 30, 30 40, 50 20 c 20 -20, 40 10, 50 60 c 10 50, 40 80, 70 80" stroke="#EA580C" stroke-width="12" />
  <path d="M350 256 c -10 20, -5 40, 10 60 c 20 25, 10 60, -30 70" stroke="#EA580C" stroke-width="12" />

  <!-- Figure 1 (Shortest - Left) -->
  <circle cx="100" cy="130" r="20" fill="#0B1E47" stroke="#0B1E47" stroke-width="4"/>
  <path d="M75 256 V 190 a 25 25 0 0 1 50 0 V 256" stroke="#0B1E47" stroke-width="16"/>
  <path d="M90 220 v 36" stroke="#FFF7ED" stroke-width="8"/>
  <path d="M110 220 v 36" stroke="#FFF7ED" stroke-width="8"/>

  <!-- Figure 2 (Medium - Left-Center) -->
  <circle cx="180" cy="95" r="24" fill="#0B1E47" stroke="#0B1E47" stroke-width="4"/>
  <path d="M150 256 V 165 a 30 30 0 0 1 60 0 V 256" stroke="#0B1E47" stroke-width="16"/>
  <path d="M170 200 v 56" stroke="#FFF7ED" stroke-width="8"/>
  <path d="M190 200 v 56" stroke="#FFF7ED" stroke-width="8"/>

  <!-- Figure 3 (Tallest - Center) -->
  <circle cx="256" cy="55" r="28" fill="#F97316" stroke="#F97316" stroke-width="4"/>
  <path d="M220 256 V 125 a 36 36 0 0 1 72 0 V 256" stroke="#F97316" stroke-width="18"/>
  <path d="M244 160 v 96" stroke="#FFF7ED" stroke-width="10"/>
  <path d="M268 160 v 96" stroke="#FFF7ED" stroke-width="10"/>

  <!-- Figure 4 (Medium - Right-Center) -->
  <circle cx="332" cy="95" r="24" fill="#0B1E47" stroke="#0B1E47" stroke-width="4"/>
  <path d="M302 256 V 165 a 30 30 0 0 1 60 0 V 256" stroke="#0B1E47" stroke-width="16"/>
  <path d="M322 200 v 56" stroke="#FFF7ED" stroke-width="8"/>
  <path d="M342 200 v 56" stroke="#FFF7ED" stroke-width="8"/>

  <!-- Figure 5 (Shortest - Right) -->
  <circle cx="412" cy="130" r="20" fill="#0B1E47" stroke="#0B1E47" stroke-width="4"/>
  <path d="M387 256 V 190 a 25 25 0 0 1 50 0 V 256" stroke="#0B1E47" stroke-width="16"/>
  <path d="M402 220 v 36" stroke="#FFF7ED" stroke-width="8"/>
  <path d="M422 220 v 36" stroke="#FFF7ED" stroke-width="8"/>
</svg>
